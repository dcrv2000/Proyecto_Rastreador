<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Registro - Bitácora Celeste</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="layout-app">
        <!-- BARRA LATERAL AZUL -->
        <aside class="sidebar-azul">
            <div>
                <div class="sidebar-marca">
                    <h2>🛰️ ORBITAL LOG</h2>
                    <p>Modificación de Registro</p>
                </div>

                <nav class="nav-menu">
                    <a href="/" class="nav-item">📊 Dashboard y Telemetría</a>
                    <a href="/control" class="nav-item activo">⚙️ Panel de Control (CRUD)</a>
                </nav>
            </div>

            <div class="sidebar-db-card">
                <small>✏️ Operación UPDATE</small>
                <p>Editando registro ID <strong>#{{ astro[0] }}</strong> en SQLite.</p>
            </div>
        </aside>

        <!-- ÁREA PRINCIPAL CREMA -->
        <main class="contenido-crema">
            <header class="cabecera-principal">
                <h1 class="titulo-principal">Editar Registro Espacial</h1>
                <a href="/control" class="btn-azul">⬅ Cancelar y Volver</a>
            </header>

            <section class="widget-azul" style="max-width: 720px;">
                <h3 class="widget-titulo">📝 Actualizar Datos de {{ astro[1] }}</h3>
                <form action="/editar/{{ astro[0] }}" method="POST" style="display: flex; flex-direction: column; gap: 12px;">
                    <label style="font-weight: 600; font-size: 0.9rem;">Nombre del Astro:</label>
                    <input type="text" name="nombre" class="input-crema" value="{{ astro[1] }}" required>

                    <label style="font-weight: 600; font-size: 0.9rem;">Categoría:</label>
                    <select name="categoria" id="select-categoria" class="select-crema" required onchange="manejarCategoria()">
                        <option value="Estrella" {% if astro[2] == 'Estrella' %}selected{% endif %}>Estrella</option>
                        <option value="Planeta" {% if astro[2] == 'Planeta' %}selected{% endif %}>Planeta</option>
                        <option value="Nebulosa" {% if astro[2] == 'Nebulosa' %}selected{% endif %}>Nebulosa</option>
                        <option value="Asteroide" {% if astro[2] == 'Asteroide' %}selected{% endif %}>Asteroide</option>
                    </select>

                    <div id="campos-estrella" class="caja-estrella">
                        <small style="color: var(--azul-primario); font-weight: 700;">✨ Propiedades de Estrellas:</small>
                        <input type="text" name="tipo_estrella" class="input-crema" value="{{ astro[3] if astro[3] != '-' else '' }}" placeholder="Tipo de Estrella (ej. Gigante Roja)">
                        
                        <select name="id_constelacion" id="select-constelacion" class="select-crema" onchange="manejarConstelacion()">
                            <option value="">Ninguna / No aplica</option>
                            {% for con in constelaciones %}
                                <option value="{{ con[0] }}" {% if astro[7] == con[0] %}selected{% endif %}>{{ con[1] }}</option>
                            {% endfor %}
                            <option value="nueva">➕ Agregar nueva constelación...</option>
                        </select>

                        <input type="text" name="nueva_constelacion_nombre" id="input-nueva-constelacion" class="input-crema input-oculto" placeholder="Nombre de la nueva constelación">
                    </div>

                    <label style="font-weight: 600; font-size: 0.9rem;">Equipo Necesario:</label>
                    <select name="equipo" class="select-crema" required>
                        <option value="A simple vista" {% if astro[4] == 'A simple vista' %}selected{% endif %}>A simple vista</option>
                        <option value="Binoculares" {% if astro[4] == 'Binoculares' %}selected{% endif %}>Binoculares</option>
                        <option value="Telescopio" {% if astro[4] == 'Telescopio' %}selected{% endif %}>Telescopio</option>
                    </select>

                    <label style="font-weight: 600; font-size: 0.9rem;">Coordenadas:</label>
                    <input type="text" name="coordenadas" class="input-crema" value="{{ astro[5] }}">

                    <label style="font-weight: 600; font-size: 0.9rem;">Guía Visual / Orientación:</label>
                    <input type="text" name="orientacion" class="input-crema" value="{{ astro[6] }}" required>

                    <button type="submit" class="btn-azul" style="align-self: flex-start; margin-top: 6px;">💾 Guardar Cambios</button>
                </form>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            manejarCategoria();
        });

        function manejarCategoria() {
            const categoriaSelect = document.getElementById('select-categoria');
            const camposEstrella = document.getElementById('campos-estrella');
            camposEstrella.style.display = (categoriaSelect.value === 'Estrella') ? 'flex' : 'none';
        }

        function manejarConstelacion() {
            const constelacionSelect = document.getElementById('select-constelacion');
            const inputNueva = document.getElementById('input-nueva-constelacion');
            if (constelacionSelect.value === 'nueva') {
                inputNueva.style.display = 'block';
                inputNueva.required = true;
            } else {
                inputNueva.style.display = 'none';
                inputNueva.required = false;
                inputNueva.value = '';
            }
        }
    </script>
</body>
</html>
